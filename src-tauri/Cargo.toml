[package]
name = "financial-blogger-agent"
version = "0.1.0"
description = "A compliant financial-content production desktop application"
authors = ["Financial Blogger Agent Team"]
edition = "2021"

[lib]
name = "financial_blogger_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "deflate", "blocking", "multipart", "system-proxy"] }
feed-rs = "2"
base64 = "0.22"
url = "2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
